<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

  </head>
  <body data-page="shop">

  <span>新客试香套装上线</span>

</div>

<header class="site-header" data-header>
  <a class="brand-lockup" href="index.html" aria-label="气味档案首页">
    <span class="brand-mark">SA</span>
    <span><strong>气味档案</strong><small>Scent Archive</small></span>
  </a>
  <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="primary-nav">
    <span></span><span></span>
  </button>
  <nav class="primary-nav" id="primary-nav" data-nav aria-label="主导航">
    <a href="index.html" data-nav="home">首页</a>
    <a href="shop.html" data-nav="shop" class="active">香水</a>
    <a href="brands.html" data-nav="brands">品牌</a>
    <a href="samples.html" data-nav="samples">试香</a>
    <a href="guide.html" data-nav="guide">选香指南</a>
    <a href="journal.html" data-nav="journal">Journal</a>
    <a href="about.html" data-nav="about">关于我们</a>
  </nav>
  <div class="header-actions">
    <form class="site-search" data-site-search>
      <label>
        <span>搜索</span>
        <input type="search" data-site-search-input placeholder="品牌、香调、场景">
      </label>
    </form>
    <div class="auth-actions" data-auth-actions>
      <a class="text-link" href="login.html">登录</a>
    </div>
    <button class="cart-button" type="button" data-open-cart>购物车 <span data-cart-count>0</span></button>
  </div>
</header>


    <main id="main">
      
      <section class="page-hero shop-hero">
        <p class="eyebrow">Fragrances</p>
        <h1>香水列表</h1>
        <p>从香调、场景、品牌和价格开始缩小范围，找到适合日常、礼物或收藏的气味。</p>
      </section>
      <section class="shop-layout section-tight">
        <form class="filters-panel" data-shop-filters>
          <label class="field-label">搜索关键词<input name="q" type="search" placeholder="茶香、木质、品牌名"></label>
          <div class="filter-group"><h2>香调</h2><div class="chip-group" data-note-filter></div></div>
          <label class="field-label">品牌<select name="brand" data-brand-filter></select></label>
          <label class="field-label">场景
            <select name="scene">
              <option value="all">全部场景</option>
              <option value="daily">日常通勤</option>
              <option value="date">约会</option>
              <option value="quiet">安静独处</option>
              <option value="gift">送礼</option>
              <option value="summer">夏天</option>
              <option value="sleep">睡前</option>
            </select>
          </label>
          <label class="field-label">分类
            <select name="category">
              <option value="fragrance">香水</option>
              <option value="home">空间香氛</option>
              <option value="all">全部商品</option>
            </select>
          </label>
          <label class="field-label">价格
            <select name="price">
              <option value="all">全部价格</option>
              <option value="under600">¥600 以下</option>
              <option value="600to900">¥600 - ¥900</option>
              <option value="over900">¥900 以上</option>
            </select>
          </label>
          <button class="button button-secondary full" type="reset">清除筛选</button>
        </form>
        <div class="shop-results">
          <div class="result-toolbar"><p data-result-count>0 件作品</p><a class="text-link" href="samples.html">不确定？先试香</a></div>
          <div class="product-grid" data-shop-grid></div>
        </div>
      </section>

    </main>

    <footer class="site-footer">
  <div>
    <strong>气味档案 Scent Archive</strong>
    <p>小众香水买手店 · 正品渠道 · 试香服务 · 线上购买</p>
  </div>

    <a href="samples.html">试香套装</a>
  </nav>
</footer>

    <div data-cart-shell></div>


    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
