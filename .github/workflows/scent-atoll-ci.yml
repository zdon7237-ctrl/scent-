name: Scent Atoll CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: 网页制作

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 网页制作/.nvmrc
          cache: npm
          cache-dependency-path: 网页制作/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check src/assets/js/app.js
          node --check src/assets/js/public-app.js
          node --check src/assets/js/cart-ui.js
          node --check src/assets/js/cart-store.js
          for file in scripts/*.mjs; do node --check "$file"; done
          node --check src/_data/catalog.js
          node --check server/src/app.mjs
          for file in tests/*.test.mjs; do node --check "$file"; done

      - name: Run launch preflight
        run: npm run launch:preflight

      - name: Verify strict launch gate
        run: npm run launch:strict
        env:
          PUBLIC_OUTPUT_DIR: /tmp/scent-atoll-ci-strict
          SITE_URL: https://www.scent-atoll.test
          CONTACT_EMAIL: hello@scent-atoll.test
          CONTACT_WECHAT: ScentAtoll
          BUSINESS_NAME: Scent Atoll Studio Ltd
          STUDIO_BOOKING: Wechat appointment

      - name: Verify commercial Vercel deployment contract
        run: npm run check:deploy
